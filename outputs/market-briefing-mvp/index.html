<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>데일리 증시 브리프</title>
    <meta name="description" content="국내 증시와 미국 증시를 매일 요약하는 브리핑 리더." />
    <link rel="stylesheet" href="./styles.css?v=20260827-stock-flow-table" />
  </head>
  <body>
    <main class="brief-shell">
      <header class="report-hero">
        <nav class="mini-nav" aria-label="브리핑 메타">
          <span>Market Brief</span>
          <span id="generatedAt">데이터 로딩 중</span>
        </nav>
        <section class="hero-copy" aria-labelledby="page-title">
          <p class="eyebrow">Daily Intelligence Report</p>
          <h1 id="page-title">오늘의 국내 · 미국 증시 브리프</h1>
        </section>
      </header>

      <section class="snapshot" aria-label="시장 스냅샷">
        <article>
          <span class="snapshot-label">국내</span>
          <strong id="domesticCount">-</strong>
          <p>국내 증시 기사</p>
        </article>
        <article>
          <span class="snapshot-label">미국</span>
          <strong id="usCount">-</strong>
          <p>미국 증시 기사</p>
        </article>
        <article>
          <span class="snapshot-label">시장 변수</span>
          <strong id="macroCount">-</strong>
          <p>금리·환율·유가·원자재·가상자산</p>
        </article>
      </section>

      <section class="market-indicators" id="marketIndicators" aria-label="금리·환율·유가·원자재·가상자산 지표" hidden>
        <div class="indicator-head">
          <span>시장 지표</span>
          <strong>금리·환율·유가·원자재·가상자산</strong>
        </div>
        <ul id="indicatorList"></ul>
      </section>

      <section class="reader">
        <aside class="section-tabs" aria-label="브리핑 섹션">
          <button class="tab-button active" data-section="domestic" type="button">
            <span>01</span>
            국내 증시
          </button>
          <button class="tab-button" data-section="us" type="button">
            <span>02</span>
            미국 증시
          </button>
          <button class="tab-button" data-section="macro" type="button">
            <span>03</span>
            시장지표 관련
          </button>
          <button class="tab-button" data-section="sector" type="button">
            <span>04</span>
            섹터/테마
          </button>
          <button class="tab-button" data-section="weekly" type="button">
            <span>05</span>
            금주의 브리핑
          </button>
          <button class="tab-button" data-section="schedule" type="button">
            <span>06</span>
            주요 일정 정리
          </button>
          <button class="tab-button" data-section="feargreed" type="button">
            <span>07</span>
            공포탐욕지수
          </button>
        </aside>

        <section class="brief-panel" aria-live="polite">
          <div class="section-head">
            <div>
              <p class="section-label" id="activeSectionKicker">Section 01</p>
              <h2 id="activeSectionTitle">국내 증시</h2>
            </div>
            <span class="article-count" id="activeArticleCount">0 articles</span>
          </div>
          <p class="section-summary" id="activeSectionSummary"></p>
          <div class="price-block" id="priceBlock" hidden>
            <h3 class="price-heading" id="priceHeading">주요 지표</h3>
            <ul class="price-list" id="activePrices"></ul>
          </div>
          <ul class="article-list" id="activeArticles"></ul>
        </section>
      </section>

    </main>
    <script src="./briefing-data.js?v=20260823-schedule-calendar-layout"></script>
    <script src="./app.js?v=20260827-stock-flow-table"></script>
  </body>
</html>
